<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Conversation — Clotus</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <script src="https://live.zwidgets.com/js-sdk/1.1/ZohoEmbededAppSDK.min.js"></script>
  <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/latest/TweenMax.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
</head>

<body>

  <div class="chat-container" id="chatContainer">

    <!-- ===== HEADER ===== -->
    <div class="chat-header">
      <div class="header-row">
        <div class="lead-avatar" id="leadAvatar" aria-hidden="true">--</div>

        <div class="lead-info">
          <div class="chat-title" id="user_full_name">Loading…</div>
          <div class="lead-meta">
            <span class="lead-phone" id="leadPhone">—</span>
            <span class="lead-divider" aria-hidden="true"></span>
            <span class="lead-status" id="leadStatus">
              <span class="status-dot status-dot--unknown" id="statusDot"></span>
              <span id="statusText">Lead</span>
            </span>
          </div>
        </div>

        <div class="header-actions">
          <button class="icon-btn" id="searchToggle" type="button" aria-label="Search messages" title="Search messages">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
          <button class="icon-btn" id="refreshBtn" type="button" aria-label="Refresh" title="Refresh">
            <i class="fa-solid fa-arrows-rotate"></i>
          </button>
        </div>
      </div>

      <!-- ===== COUNTDOWN (flip-clock) ===== -->
      <div class="wrap">
        <div class="countdown">
          <div class="bloc-time hours" data-init-value="00">
            <span class="count-title">Hours</span>
            <div class="figure hours hours-1">
              <span class="top">2</span>
              <span class="top-back"><span>2</span></span>
              <span class="bottom">2</span>
              <span class="bottom-back"><span>2</span></span>
            </div>
            <div class="figure hours hours-2">
              <span class="top">4</span>
              <span class="top-back"><span>4</span></span>
              <span class="bottom">4</span>
              <span class="bottom-back"><span>4</span></span>
            </div>
          </div>

          <div class="bloc-time min" data-init-value="0">
            <span class="count-title">Minutes</span>
            <div class="figure min min-1">
              <span class="top">0</span>
              <span class="top-back"><span>0</span></span>
              <span class="bottom">0</span>
              <span class="bottom-back"><span>0</span></span>
            </div>
            <div class="figure min min-2">
              <span class="top">0</span>
              <span class="top-back"><span>0</span></span>
              <span class="bottom">0</span>
              <span class="bottom-back"><span>0</span></span>
            </div>
          </div>

          <div class="bloc-time sec" data-init-value="0">
            <span class="count-title">Seconds</span>
            <div class="figure sec sec-1">
              <span class="top">0</span>
              <span class="top-back"><span>0</span></span>
              <span class="bottom">0</span>
              <span class="bottom-back"><span>0</span></span>
            </div>
            <div class="figure sec sec-2">
              <span class="top">0</span>
              <span class="top-back"><span>0</span></span>
              <span class="bottom">0</span>
              <span class="bottom-back"><span>0</span></span>
            </div>
          </div>
        </div>
      </div>

      <!-- ===== SEARCH BAR (slides down) ===== -->
      <div class="search-bar" id="searchBar">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="threadSearchInput" placeholder="Search in conversation…" autocomplete="off">
        <div class="search-nav">
          <span class="search-count" id="searchCount">0 / 0</span>
          <button class="icon-btn icon-btn--small" id="searchPrev" type="button" aria-label="Previous match">
            <i class="fa-solid fa-chevron-up"></i>
          </button>
          <button class="icon-btn icon-btn--small" id="searchNext" type="button" aria-label="Next match">
            <i class="fa-solid fa-chevron-down"></i>
          </button>
        </div>
        <button class="icon-btn icon-btn--small" id="searchClose" type="button" aria-label="Close search">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <!-- ===== CHAT BODY ===== -->
    <div class="chat-body" id="chatBody"></div>

    <!-- ===== FOOTER COMPOSER ===== -->
    <div class="chat-footer">
      <label for="smiley-emoji" class="smiley-emoji mb-5">
        <span id="emoji-btn" alt="smiley-emoji" class="smiley-emoji-icon" style="pointer-events: none; opacity: 0.5;">😊</span>
      </label>

      <div class="w-98 message-container">
        <div class="tab-system" id="tab-section">
          <input type="radio" id="tab1" name="tabs" value="templates" checked hidden>
          <input type="radio" id="tab2" name="tabs" value="reply" hidden>
          <div class="tab-labels">
            <label for="tab1">Template</label>
            <label for="tab2">Reply</label>
          </div>
        </div>
        <div class="dropdown">
          <input type="text" id="searchInput" placeholder="Select Template" onkeyup="filterTemplates()">
          <div id="dropdownList" class="dropdown-content"></div>
          <div id="loader" class="loader"></div>
        </div>
      </div>

      <label for="fileInput" class="mb-5">
        <img src="attachment-icon.svg" alt="Attach" class="attach-icon">
      </label>
      <input class="mb-5" type="file" id="fileInput" style="display: none" onchange="handleFileUpload(event)">

      <button onclick="sendMessage()" class="mb-5 send-btn">
        <img src="send-icon.svg" alt="Send">
      </button>
    </div>

    <!-- ===== POWERED BY ===== -->
    <div class="appfooter">
      <span class="powered">Powered by</span>
      <a href="https://clotus.tech" target="_blank" rel="noopener" class="powered-link">clotus.tech</a>
    </div>

  </div>

  <!-- Emoji Picker -->
  <emoji-picker id="emoji-picker" style="position:absolute; display:none; z-index:100;"></emoji-picker>

  <script>
    /* ============================================================
       EMOJI PICKER WIRING (kept from v0)
       ============================================================ */
    const emojiBtn = document.getElementById("emoji-btn");
    const emojiPicker = document.getElementById("emoji-picker");
    const messageBox = document.getElementById("searchInput");

    emojiBtn.addEventListener("click", () => {
      const rect = emojiBtn.getBoundingClientRect();
      const pickerHeight = 350;
      const marginFromBottom = 120;
      let topPosition = rect.top + window.scrollY - pickerHeight;
      const maxTop = window.innerHeight + window.scrollY - pickerHeight - marginFromBottom;
      topPosition = Math.min(topPosition, maxTop);
      emojiPicker.style.left = `${rect.left + window.scrollX}px`;
      emojiPicker.style.top = `${topPosition}px`;
      emojiPicker.style.display = emojiPicker.style.display === "none" ? "block" : "none";
    });

    emojiPicker.addEventListener("emoji-click", (event) => {
      const emoji = event.detail.unicode;
      const cursorPos = messageBox.selectionStart;
      const text = messageBox.value;
      messageBox.value = text.slice(0, cursorPos) + emoji + text.slice(cursorPos);
      messageBox.focus();
      messageBox.selectionStart = cursorPos + emoji.length;
      messageBox.selectionEnd = cursorPos + emoji.length;
    });

    document.addEventListener("click", (e) => {
      if (!emojiPicker.contains(e.target) && !emojiBtn.contains(e.target)) {
        emojiPicker.style.display = "none";
      }
    });

    function updateEmojiButton(currentStatus) {
      if (!emojiBtn) return;
      if (currentStatus !== "reply") {
        emojiBtn.disabled = true;
        emojiBtn.style.pointerEvents = "none";
        emojiBtn.style.opacity = "0.5";
      } else {
        emojiBtn.disabled = false;
        emojiBtn.style.pointerEvents = "auto";
        emojiBtn.style.opacity = "1";
      }
    }
  </script>

  <script src="script.js"></script>

  <script>
    /* ============================================================
       COUNTDOWN (flip-clock, kept from v0)
       ============================================================ */
    var Countdown = {
      $el: $('.countdown'),
      countdown_interval: null,
      total_seconds: 0,

      init: function (startDateTime) {
        clearInterval(this.countdown_interval);
        this.$ = {
          hours: this.$el.find('.bloc-time.hours .figure'),
          minutes: this.$el.find('.bloc-time.min .figure'),
          seconds: this.$el.find('.bloc-time.sec .figure')
        };
        document.getElementById("tab2").disabled = false;

        if (!startDateTime || isNaN(new Date(startDateTime).getTime())) {
          this.setZeroValues();
          this.onComplete();
          return;
        }

        const now = new Date();
        const elapsedMilliseconds = now - startDateTime;
        const totalMilliseconds = 24 * 60 * 60 * 1000;
        const remainingMilliseconds = totalMilliseconds - elapsedMilliseconds;

        if (remainingMilliseconds <= 0) {
          this.setZeroValues();
          this.onComplete();
          return;
        }

        const totalSeconds = Math.floor(remainingMilliseconds / 1000);
        this.values = {
          hours: Math.floor(totalSeconds / 3600),
          minutes: Math.floor((totalSeconds % 3600) / 60),
          seconds: totalSeconds % 60
        };
        this.total_seconds = totalSeconds;
        this.count();
      },

      count: function () {
        var that = this;
        var $hour_1 = this.$.hours.eq(0);
        var $hour_2 = this.$.hours.eq(1);
        var $min_1 = this.$.minutes.eq(0);
        var $min_2 = this.$.minutes.eq(1);
        var $sec_1 = this.$.seconds.eq(0);
        var $sec_2 = this.$.seconds.eq(1);

        this.countdown_interval = setInterval(function () {
          if (that.total_seconds > 0) {
            --that.values.seconds;
            if (that.values.minutes >= 0 && that.values.seconds < 0) {
              that.values.seconds = 59;
              --that.values.minutes;
            }
            if (that.values.hours >= 0 && that.values.minutes < 0) {
              that.values.minutes = 59;
              --that.values.hours;
            }
            that.checkHour(that.values.hours, $hour_1, $hour_2);
            that.checkHour(that.values.minutes, $min_1, $min_2);
            that.checkHour(that.values.seconds, $sec_1, $sec_2);
            --that.total_seconds;
          } else {
            clearInterval(that.countdown_interval);
            that.setZeroValues();
            that.onComplete();
          }
        }, 1000);
      },

      setZeroValues: function () {
        this.checkHour(0, this.$.hours.eq(0), this.$.hours.eq(1));
        this.checkHour(0, this.$.minutes.eq(0), this.$.minutes.eq(1));
        this.checkHour(0, this.$.seconds.eq(0), this.$.seconds.eq(1));
      },

      animateFigure: function ($el, value) {
        var $top = $el.find('.top');
        var $bottom = $el.find('.bottom');
        var $back_top = $el.find('.top-back');
        var $back_bottom = $el.find('.bottom-back');
        $back_top.find('span').html(value);
        $back_bottom.find('span').html(value);
        TweenMax.to($top, 0.8, {
          rotationX: '-180deg',
          transformPerspective: 300,
          ease: Quart.easeOut,
          onComplete: function () {
            $top.html(value);
            $bottom.html(value);
            TweenMax.set($top, { rotationX: 0 });
          }
        });
        TweenMax.to($back_top, 0.8, {
          rotationX: 0,
          transformPerspective: 300,
          ease: Quart.easeOut,
          clearProps: 'all'
        });
      },

      checkHour: function (value, $el_1, $el_2) {
        var val = value.toString().padStart(2, '0');
        var val_1 = val.charAt(0);
        var val_2 = val.charAt(1);
        var fig_1_value = $el_1.find('.top').html();
        var fig_2_value = $el_2.find('.top').html();
        if (fig_1_value !== val_1) this.animateFigure($el_1, val_1);
        if (fig_2_value !== val_2) this.animateFigure($el_2, val_2);
      },

      onComplete: function () {
        console.log('Countdown finished!');
        document.getElementById("tab1").checked = true;
        document.getElementById("tab2").disabled = true;
        if (typeof searchInput !== 'undefined' && searchInput) {
          searchInput.placeholder = 'Select Template';
        }
      }
    };
  </script>
</body>
</html>
